name: KineTwin Personalized Ablation

on:
  push:
    branches:
      - experiment/kinetwin-public-benchmark
    paths:
      - 'experiments/run_personalized_ablation.py'
      - '.github/workflows/kinetwin-personalized-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personalized-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: experiments/requirements-benchmark.txt
      - name: Install dependencies
        run: pip install -r experiments/requirements-benchmark.txt
      - name: Run personalized ablation
        run: |
          python experiments/run_personalized_ablation.py \
            --output personalized_ablation_output \
            --seq-len 64 \
            --shots 5 \
            --seed 20260929
      - name: Package outputs
        run: |
          cp experiments/run_personalized_ablation.py personalized_ablation_output/
          cd personalized_ablation_output
          zip -r ../KineTwin_Personalized_Ablation.zip .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KineTwin-Personalized-Ablation
          path: |
            personalized_ablation_output/**
            KineTwin_Personalized_Ablation.zip
          if-no-files-found: error
          retention-days: 30
